name: Auto Sports Scraper to Hosting

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:         
    types: [manual_trigger]    

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # ডিপেন্ডেন্সি ক্যাশ করে বিল্ড টাইম কমাবে

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      env:
        # 🔑 AES এবং হোস্টিং সিক্রেটস
        MY_AES_KEY: ${{ secrets.MY_AES_KEY }}
        MY_AES_IV: ${{ secrets.MY_AES_IV }}
        MY_BASE_URL: ${{ secrets.MY_BASE_URL }}
        MY_RECEIVER_URL: ${{ secrets.MY_RECEIVER_URL }}
        MY_RECEIVER_URL_2: ${{ secrets.MY_RECEIVER_URL_2 }} 
        MY_HOSTING_TOKEN: ${{ secrets.MY_HOSTING_TOKEN }}

        # 🛰️ ফায়ারবেস সিক্রেটস
        FIREBASE_SECRET_API_KEY: ${{ secrets.FIREBASE_SECRET_API_KEY }}
        FIREBASE_SECRET_PROJECT_ID: ${{ secrets.FIREBASE_SECRET_PROJECT_ID }}
        FIREBASE_SECRET_APP_ID: ${{ secrets.FIREBASE_SECRET_APP_ID }}
        FIREBASE_SECRET_PACKAGE_NAME: ${{ secrets.FIREBASE_SECRET_PACKAGE_NAME }}

        # 🔤 ডিক্রিপশন টেবিল সিক্রেটস
        SECRET_ARRAY_A: ${{ secrets.SECRET_ARRAY_A }}
        SECRET_ARRAY_B: ${{ secrets.SECRET_ARRAY_B }}
        
      run: python test.py
