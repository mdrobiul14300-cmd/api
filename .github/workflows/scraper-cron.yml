name: Auto Sports Scraper to Hosting
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:         
    types: [manual_trigger]    

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      env:
        MY_AES_KEY: ${{ secrets.MY_AES_KEY }}
        MY_AES_IV: ${{ secrets.MY_AES_IV }}
        MY_BASE_URL: ${{ secrets.MY_BASE_URL }}
        MY_RECEIVER_URL: ${{ secrets.MY_RECEIVER_URL }}
        MY_HOSTING_TOKEN: ${{ secrets.MY_HOSTING_TOKEN }}
        # 🟢 একদম হুবহু নিচের এই ২ লাইনের মতো করে দিন (আগে secrets. দিয়ে কানেক্ট করা ছিল না)
        MY_RECEIVER_URL_2: ${{ secrets.MY_RECEIVER_URL_2 }} 
      run: python test.py
